name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12']

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compile all Python files
        run: python -m py_compile neuro_symbolic_demo.py neuro_symbolic_demo_prolog.py neuro_symbolic_demo_ollama.py test_demo.py

      - name: Run zero-dependency demo
        run: python neuro_symbolic_demo.py

      - name: Run tests
        run: python test_demo.py
